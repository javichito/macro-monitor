<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- iOS Superellipse Icon Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#060911" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="50%" stop-color="#64d2ff" />
      <stop offset="100%" stop-color="#30d158" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle for Apple Home Screen -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="url(#ringGrad)" stroke-width="2" />

  <!-- Ambient background glow -->
  <circle cx="256" cy="256" r="160" fill="#0a84ff" opacity="0.18" filter="blur(30px)" />

  <!-- Globe & Macro Network Grid -->
  <g transform="translate(256, 256)">
    <!-- Outer Globe Circle -->
    <circle r="140" fill="none" stroke="url(#globeGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Equator -->
    <ellipse rx="140" ry="46" fill="none" stroke="url(#globeGrad)" stroke-width="8" stroke-dasharray="8 6" opacity="0.8" />

    <!-- Central Meridian -->
    <ellipse rx="58" ry="140" fill="none" stroke="url(#globeGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" />

    <!-- Equator Line -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="url(#globeGrad)" stroke-width="9" stroke-linecap="round" />

    <!-- Golden Pulse / Wealth Node -->
    <circle cx="58" cy="-42" r="14" fill="#30d158" />
    <circle cx="58" cy="-42" r="22" fill="none" stroke="#30d158" stroke-width="4" opacity="0.6" />
    
    <circle cx="-50" cy="38" r="11" fill="#0a84ff" />
    <circle cx="0" cy="0" r="12" fill="#64d2ff" />
  </g>
</svg>
