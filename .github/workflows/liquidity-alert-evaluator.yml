name: Daily Fed Liquidity Trigger Evaluator

on:
  schedule:
    # Run at 21:00 UTC (5:00 PM Eastern Time) Monday through Friday
    # after the daily Treasury statement & Thursday Fed H.4.1 releases
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  evaluate-triggers:
    name: Evaluate Fed Net Liquidity Triggers
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Liquidity Trigger Evaluation
        run: node --experimental-strip-types scripts/sync-liquidity-triggers.ts

      - name: Commit Updated Liquidity Status (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/latest-liquidity-status.json
          git diff --staged --quiet || (git commit -m "chore(data): automated daily liquidity trigger update [skip ci]" && git push origin main)
