name: Scheduled Macro Data Sync & Validation

on:
  schedule:
    # Run every Sunday at midnight UTC to check for quarterly/annual revisions
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab

jobs:
  sync-and-validate:
    name: Sync & Validate Macroeconomic Data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Data Ingestion & Boundary Verification
        run: npm run data:sync

      - name: Run Accounting Invariant Tests
        run: npm test

      - name: Typecheck Codebase
        run: npm run typecheck

      - name: Commit Updated Macroeconomic Data (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git diff --staged --quiet || (git commit -m "chore(data): automated upstream sync from World Bank & FRED [skip ci]" && git push origin main)
