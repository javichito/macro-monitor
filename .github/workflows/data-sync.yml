name: Scheduled Macro Data Sync & Validation

on:
  schedule:
    # Run every Sunday at midnight UTC to check for quarterly/annual revisions
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab

jobs:
  sync-and-validate:
    name: Sync & Validate Macroeconomic Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Data Ingestion & Boundary Verification
        run: npm run data:sync

      - name: Run Accounting Invariant Tests
        run: npm test

      - name: Typecheck Codebase
        run: npm run typecheck

      - name: Check for Data Changes
        id: git-diff
        run: |
          git status --porcelain
          if [[ -n $(git status --porcelain src/data/) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with Verified Data
        if: steps.git-diff.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): automated upstream sync from World Bank & FRED"
          title: "Automated Macroeconomic Data Sync"
          body: |
            ## Automated Upstream Sync
            This PR was automatically created by the `data-sync` workflow after verifying all accounting invariants.

            - **Source**: World Bank Open Data & FRED
            - **Status**: Vitest data invariant tests passed
          branch: automated-data-sync
          delete-branch: true
