name: Weekly Monetary Velocity & Debt Issuance Sync

on:
  schedule:
    # Run every Wednesday at 20:00 UTC (16:00 ET) after weekly Treasury auction settlement
    # and Federal Reserve H.6 M2 money stock releases
    - cron: '0 20 * * 3'
  workflow_dispatch:
    # Allows manual trigger on-demand from the GitHub Actions tab

jobs:
  sync-monetary-mechanics:
    name: Sync & Validate Monetary Velocity and Issuance Telemetry
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Monetary Velocity & Sovereign Debt Evaluator
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run data:mechanics

      - name: Validate Accounting Invariants & Bounds
        run: npx vitest run src/data/__tests__/monetary-mechanics-data.test.ts

      - name: Commit Updated Monetary Mechanics Status (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/latest-monetary-mechanics-status.json
          git diff --staged --quiet || (git commit -m "chore(data): automated monetary velocity & debt issuance sync [skip ci]" && git push origin main)
