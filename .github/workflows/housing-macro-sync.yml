name: Weekly Global Housing Macro & Affordability Sync

on:
  schedule:
    # Run every Thursday at 18:00 UTC (14:00 ET) right after Freddie Mac's
    # weekly Primary Mortgage Market Survey (PMMS) benchmark release
    - cron: '0 18 * * 4'
  workflow_dispatch:
    # Allows manual trigger on-demand from the GitHub Actions tab

jobs:
  sync-housing-data:
    name: Sync & Validate Housing Macro Telemetry
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Global Housing & Affordability Evaluator
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run data:housing

      - name: Validate Accounting Invariants & Bounds
        run: npx vitest run src/data/__tests__/housing-macro-data.test.ts

      - name: Commit Updated Housing Status (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/latest-housing-status.json
          git diff --staged --quiet || (git commit -m "chore(data): automated global housing macro & affordability sync [skip ci]" && git push origin main)
